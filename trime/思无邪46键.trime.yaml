#工具栏布局
tool_bar:
  button_spacing: 5 # 按钮间距
  button_font: [iconfont.ttf] # 按钮字体

  # 左侧固定主按钮配置
  primary_button:
    # 背景样式设置
    background:
      type: circle           # 高亮形状 (可选值: circle|rectangle)
      corner_radius: 10      # 圆角半径
      bg_normal: 0x00        # 正常状态背景颜色  #同文每夜版【2026.02.21】及以前
      bg_highlight: 工具栏前景色  # 高亮状态背景色  #hilited_candidate_button_color
      normal: 0x00           # 正常状态背景颜色  #同文每夜版【2026.02.25】开始
      highlight: 工具栏前景色  # 高亮状态背景色  #hilited_candidate_button_color
      vertical_inset: 4      # 垂直方向内缩量
      horizontal_inset: 0    # 水平方向内缩量
    # 前景内容设置
    foreground:
      font_size: 25  # 按钮字体大小
      style: "\uE13E"  # \u 必须有，且u必须为小写。
#      style: "\uE14D"  #声笔图标
#      style: "ic@dots_horizontal"         # 内置质感设计图标样式（以ic@开头）
      fg_normal: 工具栏前景色  # 正常状态前景色 (本地图片不允许着色)  #同文每夜版【2026.02.21】及以前
      # fg_highlight:        # 高亮状态前景色
      normal: 工具栏前景色    # 正常状态前景色 (本地图片不允许着色)  #同文每夜版【2026.02.25】开始
      # highlight:           # 高亮状态前景色
      padding: 10            # 前景内容与背景边界的内边距
      # size: [120, 24]      # 视图控件宽高，非前景样式宽高
    # 按钮点击事件
    action: menu_keyboard


  hide_button: &hide_button
    foreground:
      font_size: 25  # 按钮字体大小
      style: "\uE100"
#      style: "ic@keyboard_close"
      fg_normal: 工具栏前景色  #同文每夜版【2026.02.21】及以前
      normal: 工具栏前景色     #同文每夜版【2026.02.25】开始
    action: Hide

  123_button: &123_button
    foreground:
      font_size: 25  # 按钮字体大小
      style: "\uE010"
      fg_normal: 工具栏前景色  #同文每夜版【2026.02.21】及以前
      normal: 工具栏前景色     #同文每夜版【2026.02.25】开始
    action: Keyboard_number

  clipboard_button: &clipboard_button
    foreground:
      font_size: 25  # 按钮字体大小
      style: "\uE08E"
#      style: "ic@clipboard"
      fg_normal: 工具栏前景色  #同文每夜版【2026.02.21】及以前
      normal: 工具栏前景色     #同文每夜版【2026.02.25】开始
    action: Clipboard_window

  edit_button: &edit_button
    foreground:
      font_size: 25  # 按钮字体大小
      style: "\uE1C0"
#      style: "ic@cursor_text"
      fg_normal: 工具栏前景色  #同文每夜版【2026.02.21】及以前
      normal: 工具栏前景色     #同文每夜版【2026.02.25】开始
    action: Keyboard_edit

  emoji_button: &emoji_button
    foreground:
      font_size: 25  # 按钮字体大小
      style: "\uE5A0"
#      style: "ic@emoticon"
    # 前景样式可以为空，使用默认样式，按钮将显示为 action 的 label
      fg_normal: 工具栏前景色  #同文每夜版【2026.02.21】及以前
      normal: 工具栏前景色     #同文每夜版【2026.02.25】开始
    action: liquid_keyboard_emoji

  full_shape_button: &full_shape_button
    foreground:
      font_size: 25  # 按钮字体大小
#      option_styles: ["ic@moon_new", "ic@moon_full"]
      option_styles: ["\uE002", "\uE007"]
      fg_normal: 工具栏前景色  #同文每夜版【2026.02.21】及以前
      normal: 工具栏前景色     #同文每夜版【2026.02.25】开始
    action: Zenkaku_Hankaku

  ascii_mode_button: &ascii_mode_button
    foreground:
      font_size: 25  # 按钮字体大小
      option_styles: ["\uE061", "\uE071"] # 样式也可以为表，将根据 action 的 toggle 决定
      fg_normal: 工具栏前景色  #同文每夜版【2026.02.21】及以前
      normal: 工具栏前景色     #同文每夜版【2026.02.25】开始
      padding: 10
    action: Mode_switch


  # 右侧按钮列表（从右向左排列）
  buttons: [ *hide_button, *123_button, *clipboard_button, *edit_button, *emoji_button, *ascii_mode_button ]