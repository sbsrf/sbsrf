# 主布局  #键盘布局
preset_keyboards:
  default:
    landscape_keyboard: landscape_default  # lock不可为true
    lock: false
#在不同程序中切换时锁住当前键盘，不返回默认的主键盘。用于单手键盘等。（true：锁住；false：不锁，可省略不写）
#切换程序时记忆键盘，但设为true时，横屏模式landscape_keyboard不生效。
#目前lock: true和.last_lock冲突，开启后无法使用.last_lock。
#发现：在助记键盘中lock: true，一旦使用助记键盘，返回并收取键盘后，再次进入直接打开的是助记键盘。
#同时，助记键盘写为lock: false，有可能键盘和同文APP设置同时打不开（亲测），如您没该问题也可能引起其他bug，故建议助记键盘不写lock。
#popup: 的写法可不需要 长按【long_click】配合且长按无效；未设置长按且需要显示，添加对应 label_symbol 即可。
#使用 Space: {slide_cursor: true, send: space}设置后，可快速连续左右“滑动”编码或上屏后的字词，swipe_left和swipe_right失效；原left和right为单次左右“划动”编码（横向显示时，为候选字词）或上屏后的字词。
    ascii_mode: 0
    width: 10
    height: *主键高
    key_symbol_offset_x: *上符x
    key_symbol_offset_y: *上符y
    key_text_offset_y: *字y
    key_hint_offset_y: *下符y
    key_press_offset_y: *按下偏移y
    label_transform: uppercase # 中文时字母大写显示：uppercase 小写：none
    keys:
# 第一行
      - {click: 1, long_click: '!', __include: 1}
      - {click: 2, long_click: '@', __include: 2}
      - {click: 3, long_click: '#', __include: 3}
      - {click: 4, long_click: '$', __include: 4}
      - {click: 5, long_click: '%', __include: 5}
      - {click: 6, long_click: '^', __include: 6}
      - {click: 7, long_click: '&', __include: 7}
      - {click: 8, long_click: '*', __include: 8}
      - {click: 9, long_click: '(', __include: 9}
      - {click: 0, long_click: ')', __include: 0}
# 第二行
      - {click: q, long_click: '`', swipe_up: Q, __include: q}
      - {click: w, long_click: '~', swipe_up: W, __include: w}
      - {click: e, long_click: '+', swipe_up: E, __include: e}
      - {click: r, long_click: '-', swipe_up: R, __include: r}
      - {click: t, long_click: '=', swipe_up: T, __include: t}
      - {click: y, long_click: '_', swipe_up: Y, __include: y}
      - {click: u, long_click: '{', swipe_up: U, __include: u}
      - {click: i, long_click: '}', swipe_up: I, __include: i}
      - {click: o, long_click: '[', swipe_up: O, __include: o}
      - {click: p, long_click: ']', swipe_up: P, __include: p}
# 第三行
      - {width: 2.8}
      - {width: 9.5, click: a, long_click: '\', swipe_up: A, __include: a}
      - {width: 9.5, click: s, long_click: '|', swipe_up: S, __include: s}
      - {width: 9.5, click: d, long_click: '×', swipe_up: D, __include: d}
      - {width: 9.5, click: f, long_click: '÷', swipe_up: F, __include: f}
      - {width: 9.5, click: g, long_click: '←', popup: ["←", "Home1"], swipe_up: G, __include: g}
      - {width: 9.5, click: h, long_click: '→', popup: ["→", "End1"], swipe_up: H, __include: h2}
      - {width: 9.5, click: j, long_click: undo, label_symbol: ↶, swipe_up: J, __include: j2}
      - {width: 9.5, click: k, long_click: redo, label_symbol: ↷, swipe_up: K, __include: k2}
      - {width: 9.5, click: l, long_click: '{Control+l}', label_symbol: ⇐, swipe_up: L, __include: l2}
      - {width: 9.5, click: ';', label: ' ；', long_click: ':', __include: 分号}
      - {width: 2.2}
# 第四行
      - {width: 15, click: Shift_L, long_click: Shift_L, double_click: Shift_L3, label_symbol: ' ', composing: Tab, swipe_up: '{Shift+Tab}', swipe_down: Page_Down, __include: 功能}
      - {click: z, long_click: select_all, swipe_up: Z, __include: z}
      - {click: x, long_click: cut, swipe_up: X, __include: x}
      - {click: c, long_click: copy, swipe_up: C, __include: c}
      - {click: v, long_click: paste_clip, swipe_up: V, __include: v}
      - {click: b, long_click: Clipboard_window, swipe_up: B, __include: b}
      - {click: n, long_click: liquid_keyboard_emoji, swipe_up: N, __include: n}
      - {click: m, long_click: Hide, swipe_up: M, __include: m}
      - {width: 15, click: BackSpace, swipe_up: '{Shift+Return}', swipe_left: Escape, swipe_down: DeleteCandidate, __include: 退格}
# 第五行
      - {width: 15, click: Keyboard_number, composing: Escape, long_click: 计算, popup: ["计算1", "编码注释", "刷新1"], swipe_up: "{Schema_switch}", __include: 数字}
      - {width: 11, click: '/', long_click: '?', swipe_up: '{Symbol_switch}{Hint_switch}', swipe_down: '{Symbol_switch}{Hint_switch}', key_text_size: 20, __include: 斜杠}
      - {width: 11, click: ',', label: '️ ，️', long_click: '<', swipe_up: IME_switch, swipe_down: IME_switch, key_text_size: 20, __include: 逗号}
#      - {width: 26, click: Space, long_click: Mode_switch, label_symbol: " ", swipe_up: '{Shift+space}', swipe_down: '{space}{Mode_switch}', swipe_left: Left, swipe_right: Right, __include: 空格}
      - {width: 26, click: Space, long_click: Mode_switch, label_symbol: " ", swipe_up: '{Shift+space}', swipe_down: '{space}{Mode_switch}', __include: 空格}
      - {width: 11, click: '.', label: ' 。', long_click: '>', swipe_up: Menu, swipe_down: Menu, key_text_size: 20, __include: 句号}
      - {width: 11, click: "'", long_click: '"', swipe_up: Theme_settings, swipe_down: Theme_settings, key_text_size: 20, __include: 引号}
      - {width: 15, click: Return, label: enter_labels, long_click: Color_settings, label_symbol: ' ', swipe_up: '{Control+Return}', __include: 回车}

