author: Q_name/莫颜  #主制作：Q_name ，微配适：莫颜
#中间行和底行可调整宽度：中间行左留白2.8  右留白2.2；底行空格26.3  句号引号10.95  回车14.8
#因旧版（每夜版2025.09.16前）状态栏和液态键盘（流式键盘）不支持图片点九（.9），故状态栏和key_back_color图片需使用非点九（.9）命名。
快捷配置锚点:
  #悬浮窗
      #请在  APP→候选窗口→候选词列表布局  中选择。
      #如选择“自动”，默认竖向显示，在方案中设定相关参数后，可在同文键盘的方案开关里设置横竖向。可参考sbfm.custom.yaml设定。
    #悬浮窗             #字号等
  🥭: &预编辑字号 19    #新版 font_size          #旧版 text_size
  🥭: &序号字号 19      #新版 label_font_size    #旧版 label_text_size
  🥭: &文字字号 20      #新版 text_font_size     #旧版 candidate_text_size
  🥭: &注释字号 16      #新版 comment_font_size  #旧版 comment_text_size
  🥭: &悬浮圆角 5       #悬浮窗圆角半径（浮点）  #corner_radius

  #字体
    #字体设置           #组合方式必须要有[]
#  🥭: &字体组合 [Singbit.ttf, LXGWWenKaiGBScreen.ttf, WenJinMinchoP0.ttf, WenJinMinchoP2.ttf, WenJinMinchoP3.ttf]
#  🥭: &字体组合 [Singbit.ttf, LXGWWenKaiGBScreen.ttf, PlangothicP1.ttf, PlangothicP2.ttf]
  🥭: &字体组合 [Singbit.ttf, LXGWWenKaiGBScreen.ttf, WenJinMinchoP0.ttf, WenJinMinchoP2.ttf, WenJinMinchoP3.ttf, PlangothicP1.ttf, PlangothicP2.ttf]
    #键盘字号
  🥭: &按键字号 20     #数字+字母+符号 字号
  🥭: &功能字号 16     #功能键 字号

  #键盘设置
    #通用设置·竖屏
  🥭: &竖屏总高 285
  🥭: &竖屏增高 20
  🥭: &竖屏两侧 0
  🥭: &竖屏左侧 0
  🥭: &竖屏右侧 0
    #通用设置·横屏
  🥭: &横屏总高 200
  🥭: &横屏增高 0
  🥭: &横屏两侧 40

    #主键盘等
  🥭: &主键高 57

    # 数字键盘：
  🥭: &顶行高 7
  🥭: &九键高 63
  🥭: &末行高 20  #预留高度，未使用

    # 键距（不包含数字键盘）/圆角：
  🥭: &行距 2    #新旧版本此处设定不同。如果使用旧版，请自行调整 行距、列、圆角 至自己满意的值。
  🥭: &列距 2
  🥭: &圆角 6

    # 字符 X/Y 轴偏移：左移上移负数-，右移下移正数
  🥭: &上符x 0
  🥭: &上符y -1.5
  🥭: &字y 0
  🥭: &下符y -1
  🥭: &按下偏移y 2

    #助记切片
  🥭: &切片高 270    #两者相加等于：竖排锁定高度
  🥭: &切片底 15     #两者相加等于：竖排锁定高度

style:
# 锁定总高度、边距
  # 竖屏键盘
  keyboard_height: *竖屏总高 #竖屏高
  keyboard_padding: *竖屏两侧 #竖屏时，屏幕左右两侧与键盘的距离（曲面屏减少误触）
  keyboard_padding_bottom: *竖屏增高 #竖屏时，屏幕底部与键盘的距离（避免误触发全面屏手势）
  keyboard_padding_left: *竖屏左侧 #竖屏时，左手键盘布局，屏幕左侧与键盘的距离
  keyboard_padding_right: *竖屏右侧 #竖屏时，右手键盘布局，屏幕右侧与键盘的距离
# 横屏键盘
  keyboard_height_land: *横屏总高 #横屏高
  keyboard_padding_land: *横屏两侧 #横屏时，屏幕左右两侧与键盘的距离（避免横屏按键过度拉伸变形）
  keyboard_padding_land_bottom: *横屏增高 #横屏时，屏幕底部与键盘的距离（避免误触发全面屏手势）

# 字型、字号
  latin_font: [LXGWWenKaiGBScreen.ttf] #latin.ttf #西文字型
  text_font: [LXGWWenKaiGBScreen.ttf] #latin.ttf #编码字型
  comment_font: *字体组合 #comment.ttf #編碼提示字型
  candidate_font: *字体组合 #han.ttf #候选字型
  key_font: [LXGWWenKaiGBScreen.ttf] #symbol.ttf #按键字型
  popup_font: [LXGWWenKaiGBScreen.ttf] #latin.ttf #按键气泡字型  #每夜版2025.11.14起  新启用，popup替代preview
  label_font: [LXGWWenKaiGBScreen.ttf] #label.ttf #悬浮窗序号字型
  symbol_font: [LXGWWenKaiGBScreen.ttf] #symbol.ttf #符号字型
  hanb_font: *字体组合 #扩充字型
  comment_text_size: 13 #候选窗和状态栏提示字号
  candidate_text_size: 19 #候选字号
  key_text_size: *按键字号 #按键字号
  popup_text_size: 20 #按键气泡字号  #每夜版2025.11.14起  新启用，popup替代preview
  key_long_text_size: 17 #长文本按键字号
  symbol_text_size: 10 #上下符字号

# 状态栏
  comment_position: right #编码提示布局位置：right / top / overlay
  comment_height: 0 #编码提示区高度（仅 top 模式约束高度，其余模式与 candidate_view_height 无区别）
  comment_vertical_bias: 0.0 #编码提示垂直偏移位置（仅 overlay 模式使用，需要间隙空间足够，范围 0.0~1.0，0.0=top，0.5=center，1.0=bottom）
  candidate_view_height: 54 #候选区高度
  candidate_text_vertical_bias: 1.0 #候选文本垂直偏移位置（仅 overlay 模式使用，需要间隙空间足够，范围 0.0~1.0，0.0=top，0.5=center，1.0=bottom）
  candidate_corner_radius: 4 #候选项圆角半径
  candidate_padding: 10 #候选项内边距
  candidate_spacing: 1 #候选项分割线宽度（会影响候选间距）
  candidate_use_cursor: true #候选项“高亮”标注

# 语言/键盘
  # background_folder: #背景图保存在background目录下的哪个子目录
  auto_caps: false #自动句首大写:true|false|ascii
  reset_ascii_mode_on_focus_change: false #焦点变更弹起输入法软键盘时，重置 ascii_mode
  key_border: 1 #按键边框宽度
  key_width: 10.0 #键宽，占银幕宽的百分比
  key_height: 55 #键高
  vertical_gap: *行距 #按键行距
  horizontal_gap: *列距 #按键列距
  round_corner: *圆角 #按鍵圓角半徑
  vertical_correction: 0 #按键实际纵向偏移 负为向下
  shadow_radius: 0.0 #按键阴影半径
  popup_width: 38 #按键气泡宽度  #每夜版2025.11.14起  新启用，popup替代preview
  popup_height: 55 #按键气泡高度
  popup_bottom_margin: 68 #按键气泡底部边距（较原始按键上移距离）
  popup_key_height: 57 #{__include: /style/popup_height} #按键气泡内键（容器）高度；跟随按键气泡高度，也可为数值（建议值：按键气泡高度+2）
  proximity_correction: true #按键纠错
  enter_label_mode: 3 #是否使用App提供的ActionLabel内容作为Enter键的文本（由于多数App没有适配ActionLable，实际影响不大）。0不使用，1只使用actionlabel，2优先使用，3当其他方式没有获得label时才读取actionlabel
  enter_labels: #定义Enter键的文本
    go: 前往
    done: 完成
    next: 下个
    pre:  上个
    search: 搜索
    send: 发送
    default: 回车 #定义默认Enter键的文本


#预编辑（编码区）文本视图参数
preedit:                          # 预编辑文本视图参数
  horizontal_padding: 8           # 横向内边距（整数）
#  alpha: 0.8                     # 透明度（0-1，浮点）
  top_end_radius: 4               # 末上端圆角（浮点）
  foreground:                     # 前景样式
    font_size: *预编辑字号         # 预编辑字体大小（浮点）

#悬浮窗（候选窗口）
window:                           # 候选窗口（悬浮窗）参数
  insets:                         # 窗口内边距
    vertical: 4                   # 纵向内边距（整数）
    horizontal: 4                 # 横向内边距（整数）
  item_padding:                   # 候选项内边距
#    vertical: 0                  # 纵向内边距（整数）
    horizontal: 4                 # 横向内边距（整数）
#  min_width: 0                   # 最小宽度（整数）
  corner_radius: *悬浮圆角         # 圆角半径（浮点）
  border: 2 #边框宽度（整数）
  shadow: 15 #阴影半径（浮点）
#  alpha: 1                       # 透明度（0-1，浮点）
  foreground:                     # 前景样式
    label_font_size: *序号字号     # 序号字体大小（浮点）
    text_font_size: *文字字号      # 文字字体大小（浮点）
    comment_font_size: *注释字号   # 注释字体大小（浮点）


