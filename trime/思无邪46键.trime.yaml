# 配色方案：
#（以下配色项注释参数无定义则跟随，悬浮窗定义图片背景报错，各项参数以顿号分隔）
preset_color_schemes:
  default:
    name: 清白
    dark_scheme: e0 #指定夜间配色
# 🍑 背景：
    状态栏首选（高亮标注项）+非首选高亮: 0x00 #编码+悬浮窗首选（高亮标注项）、气泡高亮
    键盘(状态栏+底栏): 0xB2C7CC #状态栏、悬浮窗^、气泡
    悬浮窗^: 0xbffefefe
    按键: 思无邪/纯真/清白/zj.9.png
    按键高亮: 0x0E5C68
# 🍑 字色：
    首选（高亮标注项）: 0xDC143C #首选提示、首选序号、气泡字高亮
    非首选: 0x353535 #悬浮窗边框、候选分割线、编码、“^”插入符号、非首选提示、非首选序号、气泡字色、按键边框

    编码: 0xFF1900
    首选序号: 0x2E81FF
    非首选提示: 0xFF1900
    非首选序号: 0x2E81FF
    按键字色: 0x535353 #按键字高亮、按键符色、按键符高亮、按键文字阴影
# 🍑 Shift键（功能键，开启：functional: true；上下符无法跟随）：
    常态背景: 思无邪/纯真/清白/gn.9.png #锁定背景
    常态背景高亮: 0xFBFBFB #锁定背景高亮
    常态字色: 0xFFB773 #常态字高亮、常态符色、常态符高亮
    锁定字色: 0xFF0000 #锁定字高亮
# 🍑 气泡：
    气泡高亮: 0x0E5C68

  e:
    name: 玫金
    dark_scheme: e1 #指定夜间配色
# 🍑 背景：
    状态栏首选（高亮标注项）+非首选高亮: 0x00 #编码+悬浮窗首选（高亮标注项）、气泡高亮
    键盘(状态栏+底栏): 0xDBC1C0 #状态栏、悬浮窗^、气泡
